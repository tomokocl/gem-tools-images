<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像テキスト抽出ツール</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }

        h1 {
            text-align: center; font-size: 1.8rem; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 2rem; font-size: 0.9rem; }

        .api-key-section {
            background: #1a1a1a; border-radius: 12px; padding: 1rem 1.5rem;
            margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem;
        }
        .api-key-section label { color: #888; font-size: 0.85rem; white-space: nowrap; }
        .api-key-input {
            flex: 1; background: #111; border: 1px solid #333; border-radius: 8px;
            color: #e0e0e0; padding: 0.5rem 0.75rem; font-size: 0.85rem; font-family: monospace;
        }
        .api-key-input:focus { outline: none; border-color: #ff6b6b; }
        .api-key-status { font-size: 0.75rem; color: #666; white-space: nowrap; }
        .api-key-status.saved { color: #4caf50; }

        .drop-zone {
            border: 2px dashed #444; border-radius: 16px; padding: 3rem 2rem;
            text-align: center; cursor: pointer; transition: all 0.3s;
            background: #1a1a1a; margin-bottom: 1.5rem;
        }
        .drop-zone:hover, .drop-zone.dragover { border-color: #ff6b6b; background: #1f1a1a; }
        .drop-zone-icon { font-size: 3rem; margin-bottom: 1rem; }
        .drop-zone p { color: #999; }
        .drop-zone .browse { color: #ff6b6b; text-decoration: underline; cursor: pointer; }
        #fileInput { display: none; }

        .gallery { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .gallery-label { color: #888; font-size: 0.85rem; margin-bottom: 0.5rem; display: block; }
        .gallery-item {
            width: 80px; height: 60px; border-radius: 8px; overflow: hidden;
            cursor: pointer; border: 2px solid transparent; opacity: 0.7; transition: all 0.2s;
        }
        .gallery-item:hover { opacity: 1; border-color: #ff6b6b; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        .main-area { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        @media (max-width: 768px) {
            .main-area { grid-template-columns: 1fr; }
            .api-key-section { flex-direction: column; align-items: stretch; }
        }

        .panel { background: #1a1a1a; border-radius: 12px; padding: 1.5rem; min-height: 400px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        .panel-title { font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
        .preview-img { width: 100%; border-radius: 8px; display: none; }
        .placeholder { display: flex; align-items: center; justify-content: center; height: 300px; color: #555; font-size: 0.9rem; }

        #extractedText {
            width: 100%; min-height: 300px; background: #111; border: 1px solid #333;
            border-radius: 8px; color: #e0e0e0; padding: 1rem; font-size: 0.95rem;
            line-height: 1.7; resize: vertical; font-family: inherit;
        }
        #extractedText:focus { outline: none; border-color: #ff6b6b; }

        .btn { padding: 0.5rem 1rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn-secondary { background: #333; color: #ccc; }
        .btn-secondary:hover { background: #444; }
        .btn-group { display: flex; gap: 0.5rem; align-items: center; }

        .status { font-size: 0.8rem; color: #888; text-align: center; min-height: 1.2em; margin: 1rem 0; }
        .status.loading::after {
            content: ''; display: inline-block; width: 12px; height: 12px;
            border: 2px solid #ff6b6b; border-top-color: transparent; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-left: 0.5rem; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .copy-toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333; color: #fff; padding: 0.75rem 1.5rem;
            border-radius: 8px; font-size: 0.85rem; transition: transform 0.3s; z-index: 100;
        }
        .copy-toast.show { transform: translateX(-50%) translateY(0); }

        .prompt-select {
            background: #222; border: 1px solid #444; color: #ccc;
            padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.8rem;
        }

        .design-tabs { display: none; align-items: center; gap: 0.25rem; margin-bottom: 0.75rem; }
        .design-tabs.show { display: flex; }
        .tab {
            padding: 0.4rem 1rem; background: #222; color: #888; border: 1px solid #333;
            cursor: pointer; font-size: 0.8rem; border-radius: 6px; transition: all 0.2s;
        }
        .tab.active { background: #444; color: #e0e0e0; border-color: #666; }

        /* レイヤーエディタ */
        .layer-editor-wrapper { display: none; margin-top: 1.5rem; }
        .layer-editor-wrapper.show { display: block; }
        .layer-editor-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
        }
        .layer-editor-container {
            position: relative; display: inline-block; overflow: hidden;
            border-radius: 8px; border: 1px solid #333; max-width: 100%;
        }
        .layer-editor-container img { display: block; max-width: 100%; height: auto; }
        .text-overlay {
            position: absolute; cursor: move; outline: none;
            transition: box-shadow 0.2s;
            white-space: pre-wrap; word-break: break-all;
        }
        .text-overlay:hover { box-shadow: 0 0 0 2px rgba(255, 107, 107, 0.5); }
        .text-overlay:focus { box-shadow: 0 0 0 2px #ff6b6b; }
        .layer-hint { color: #666; font-size: 0.75rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>画像テキスト抽出ツール</h1>
        <p class="subtitle">Claude APIのビジョン機能で画像内テキストを高精度抽出。抽出後はそのまま編集・コピー可能</p>

        <div class="api-key-section">
            <label for="apiKeyInput">Claude API Key:</label>
            <input type="password" class="api-key-input" id="apiKeyInput" placeholder="sk-ant-api03-...">
            <span class="api-key-status" id="apiKeyStatus"></span>
        </div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">📷</div>
            <p>画像をドラッグ＆ドロップ、または<span class="browse">ファイルを選択</span></p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <span class="gallery-label">リポジトリ内の画像:</span>
        <div class="gallery" id="gallery"></div>

        <div class="status" id="status"></div>

        <div class="main-area">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">プレビュー</span>
                </div>
                <img class="preview-img" id="previewImg">
                <div class="placeholder" id="previewPlaceholder">画像を選択してください</div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title" id="rightPanelTitle">抽出テキスト</span>
                    <div class="btn-group">
                        <select class="prompt-select" id="promptSelect">
                            <option value="extract">テキスト抽出</option>
                            <option value="layer">Canva用SVG</option>
                            <option value="design">デザインごと抽出</option>
                            <option value="structured">構造化抽出</option>
                            <option value="translate">抽出+英訳</option>
                        </select>
                        <button class="btn btn-secondary" id="copyBtn" onclick="copyText()">コピー</button>
                    </div>
                </div>
                <div class="design-tabs" id="designTabs">
                    <div class="tab active" id="tabPreview" onclick="switchTab('preview')">プレビュー</div>
                    <div class="tab" id="tabCode" onclick="switchTab('code')">HTML/CSS</div>
                    <button class="btn btn-secondary" style="margin-left:auto" onclick="downloadDesignHTML()">DL</button>
                </div>
                <iframe id="designIframe" style="display:none; width:100%; min-height:350px; border:1px solid #333; border-radius:8px; background:#fff;"></iframe>
                <textarea id="extractedText" placeholder="ここに抽出されたテキストが表示されます。&#10;抽出後は自由に編集できます。"></textarea>
            </div>
        </div>

        <!-- レイヤーエディタ（全幅表示） -->
        <div class="layer-editor-wrapper" id="layerEditorWrapper">
            <div class="layer-editor-header">
                <span class="panel-title">SVGプレビュー — テキストは個別オブジェクト</span>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="downloadSVG()">SVGダウンロード</button>
                    <button class="btn btn-secondary" onclick="downloadSVGTextOnly()">テキストのみSVG</button>
                </div>
            </div>
            <div class="layer-editor-container" id="layerEditorContainer"></div>
            <p class="layer-hint">Canvaにこの SVG をアップロードすると、テキストが個別に編集できます</p>
        </div>
    </div>

    <div class="copy-toast" id="toast">コピーしました！</div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const extractedText = document.getElementById('extractedText');
        const statusEl = document.getElementById('status');
        const gallery = document.getElementById('gallery');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiKeyStatus = document.getElementById('apiKeyStatus');
        const promptSelect = document.getElementById('promptSelect');
        const designIframe = document.getElementById('designIframe');
        const designTabs = document.getElementById('designTabs');
        const copyBtn = document.getElementById('copyBtn');
        const layerEditorWrapper = document.getElementById('layerEditorWrapper');
        const layerEditorContainer = document.getElementById('layerEditorContainer');

        let currentImageBase64 = null;
        let currentMediaType = 'image/png';
        let currentImageDataUrl = null;
        let lastDesignHTML = '';

        // APIキー保存/復元
        const savedKey = localStorage.getItem('claude_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
            apiKeyStatus.textContent = '保存済み';
            apiKeyStatus.className = 'api-key-status saved';
        }
        apiKeyInput.addEventListener('input', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('claude_api_key', key);
                apiKeyStatus.textContent = '保存済み';
                apiKeyStatus.className = 'api-key-status saved';
            } else {
                localStorage.removeItem('claude_api_key');
                apiKeyStatus.textContent = '';
                apiKeyStatus.className = 'api-key-status';
            }
        });

        // プロンプト定義
        const prompts = {
            extract: 'この画像に含まれるすべてのテキストを正確に抽出してください。レイアウトや改行をできるだけ保持してください。テキストのみを出力し、説明は不要です。',
            layer: `この画像内のすべてのテキスト要素を解析してJSON配列で出力してください。
画像サイズは幅1200px × 高さ675px と仮定してください。

出力はJSON配列のみ（説明不要、コードブロック不要）:
[
  {
    "text": "テキスト内容",
    "x": 左端からのピクセル座標(数値),
    "y": テキストのベースラインのピクセル座標(数値),
    "fontSize": フォントサイズ(px数値),
    "fontWeight": "bold" or "normal" or "900",
    "color": "#FFFFFF" 等の色コード
  }
]

注意:
- 全てのテキストを漏れなく含める
- 背景に溶け込む装飾テキストも含める
- 位置は画像内での見た目通りに正確に
- 改行が含まれるテキストは行ごとに別要素にする
- x, y はピクセル単位（1200x675基準）`,
            design: `この画像のテキストデザインをHTML/CSSで完全に再現してください。

ルール:
- 完全な1つのHTMLファイルとして出力（<!DOCTYPE html>から</html>まで）
- テキストの内容、フォントサイズ、太さ、色、背景色、配置、余白をできるだけ忠実に再現
- Google Fontsの Noto Sans JP を使用
- テキストは全てHTMLテキストとして記述（画像は使わない）
- レスポンシブ対応不要、元画像の見た目に忠実に
- 説明テキストは一切不要、HTMLコードのみを出力
- コードブロック(\`\`\`)で囲まない、純粋なHTMLのみ`,
            structured: 'この画像に含まれるテキストを構造化して抽出してください。見出し、本文、日時、名前などを分類し、Markdown形式で出力してください。',
            translate: 'この画像に含まれるすべてのテキストを抽出し、その後に英語翻訳を付けてください。フォーマット:\n\n【原文】\n(抽出テキスト)\n\n【English Translation】\n(翻訳)'
        };

        // ギャラリー
        const repoImages = [
            '13_ashisutannto2.png',
            'gem00.png', 'gem01.png', 'gem02.png', 'gem03.png', 'gem04.png',
            'gem05.png', 'gem06.png', 'gem07.png', 'gem08.png', 'gem09.png',
            'gem10.png', 'gem11.png', 'gem13.png', 'gem14.png', 'gem15.png',
            'gem16.png', 'gem17.png', 'gem19.png', 'gem_short.png'
        ];
        repoImages.forEach(name => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="${name}" alt="${name}" title="${name}">`;
            item.addEventListener('click', () => loadRepoImage(name));
            gallery.appendChild(item);
        });

        function loadRepoImage(name) {
            previewImg.src = name;
            previewImg.style.display = 'block';
            previewPlaceholder.style.display = 'none';
            fetch(name)
                .then(r => r.blob())
                .then(blob => blobToBase64(blob))
                .then(({ base64, mediaType, dataUrl }) => resizeImageIfNeeded(base64, mediaType, dataUrl))
                .then(({ base64, mediaType, dataUrl }) => {
                    currentImageBase64 = base64;
                    currentMediaType = mediaType;
                    currentImageDataUrl = dataUrl;
                    extractWithClaude();
                });
        }

        const MAX_BASE64_BYTES = 5 * 1024 * 1024;

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const dataUrl = reader.result;
                    const base64 = dataUrl.split(',')[1];
                    const mediaType = dataUrl.match(/^data:(.*?);/)[1];
                    resolve({ base64, mediaType, dataUrl });
                };
                reader.readAsDataURL(blob);
            });
        }

        function resizeImageIfNeeded(base64, mediaType, dataUrl) {
            return new Promise((resolve) => {
                const byteSize = atob(base64).length;
                if (byteSize <= MAX_BASE64_BYTES) {
                    resolve({ base64, mediaType, dataUrl });
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    let scale = Math.sqrt(MAX_BASE64_BYTES / byteSize) * 0.9;
                    let quality = 0.85;
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    function tryResize() {
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const resizedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        const resizedBase64 = resizedDataUrl.split(',')[1];
                        const resizedSize = atob(resizedBase64).length;
                        if (resizedSize <= MAX_BASE64_BYTES) {
                            statusEl.textContent = `画像をリサイズ (${(byteSize/1024/1024).toFixed(1)}MB → ${(resizedSize/1024/1024).toFixed(1)}MB)`;
                            resolve({ base64: resizedBase64, mediaType: 'image/jpeg', dataUrl: resizedDataUrl });
                        } else {
                            scale *= 0.8;
                            quality = Math.max(0.5, quality - 0.1);
                            tryResize();
                        }
                    }
                    tryResize();
                };
                img.src = dataUrl;
            });
        }

        // ドラッグ＆ドロップ
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', e => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) handleFile(file);
        });
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = async e => {
                const dataUrl = e.target.result;
                previewImg.src = dataUrl;
                previewImg.style.display = 'block';
                previewPlaceholder.style.display = 'none';
                const base64 = dataUrl.split(',')[1];
                const mediaType = dataUrl.match(/^data:(.*?);/)[1];
                const resized = await resizeImageIfNeeded(base64, mediaType, dataUrl);
                currentImageBase64 = resized.base64;
                currentMediaType = resized.mediaType;
                currentImageDataUrl = resized.dataUrl;
                extractWithClaude();
            };
            reader.readAsDataURL(file);
        }

        async function extractWithClaude() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) { statusEl.textContent = 'Claude API Keyを入力してください'; statusEl.className = 'status'; return; }
            if (!currentImageBase64) return;

            const mode = promptSelect.value;
            statusEl.textContent = 'Claude APIで解析中...';
            statusEl.className = 'status loading';
            extractedText.value = '';

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: (mode === 'design' || mode === 'layer') ? 8192 : 4096,
                        messages: [{
                            role: 'user',
                            content: [
                                { type: 'image', source: { type: 'base64', media_type: currentMediaType, data: currentImageBase64 } },
                                { type: 'text', text: prompts[mode] }
                            ]
                        }]
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || `API Error: ${response.status}`);
                }

                const data = await response.json();
                const text = data.content.filter(c => c.type === 'text').map(c => c.text).join('\n');

                // モード別処理
                if (mode === 'layer') {
                    handleLayerResult(text);
                } else if (mode === 'design') {
                    handleDesignResult(text);
                } else {
                    extractedText.value = text;
                    setNormalMode();
                }

                statusEl.textContent = '抽出完了！';
                statusEl.className = 'status';
            } catch (err) {
                statusEl.textContent = 'エラー: ' + err.message;
                statusEl.className = 'status';
            }
        }

        // === Canva用SVG ===
        const SVG_W = 1200, SVG_H = 675;
        let lastSVGData = null; // { layers, svgFull, svgTextOnly }

        function handleLayerResult(text) {
            setNormalMode();
            try {
                let jsonStr = text.trim();
                const match = jsonStr.match(/\[[\s\S]*\]/);
                if (match) jsonStr = match[0];
                const layers = JSON.parse(jsonStr);

                // SVG生成
                const svgFull = buildSVG(layers, true);
                const svgTextOnly = buildSVG(layers, false);
                lastSVGData = { layers, svgFull, svgTextOnly };

                extractedText.value = layers.map(l => `[${l.fontSize}px ${l.fontWeight} ${l.color}] ${l.text}`).join('\n');

                // プレビュー表示
                layerEditorContainer.innerHTML = '';
                const previewDiv = document.createElement('div');
                previewDiv.innerHTML = svgFull;
                previewDiv.querySelector('svg').style.maxWidth = '100%';
                previewDiv.querySelector('svg').style.height = 'auto';
                layerEditorContainer.appendChild(previewDiv);

                layerEditorWrapper.classList.add('show');
            } catch (e) {
                extractedText.value = 'JSONパースエラー。生データ:\n\n' + text;
                layerEditorWrapper.classList.remove('show');
            }
        }

        function escXml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function buildSVG(layers, includeImage) {
            let defs = '';
            let elements = '';

            if (includeImage && currentImageDataUrl) {
                elements += `  <image href="${currentImageDataUrl}" x="0" y="0" width="${SVG_W}" height="${SVG_H}" preserveAspectRatio="xMidYMid slice"/>\n`;
            }

            layers.forEach((l, i) => {
                const fw = l.fontWeight === '900' ? 900 : (l.fontWeight === 'bold' ? 700 : 400);
                const lines = l.text.split('\n');
                if (lines.length === 1) {
                    elements += `  <text x="${l.x}" y="${l.y}" font-family="Noto Sans JP, sans-serif" font-size="${l.fontSize}" font-weight="${fw}" fill="${l.color}">${escXml(l.text)}</text>\n`;
                } else {
                    elements += `  <text x="${l.x}" y="${l.y}" font-family="Noto Sans JP, sans-serif" font-size="${l.fontSize}" font-weight="${fw}" fill="${l.color}">\n`;
                    lines.forEach((line, li) => {
                        if (li === 0) {
                            elements += `    <tspan x="${l.x}" dy="0">${escXml(line)}</tspan>\n`;
                        } else {
                            elements += `    <tspan x="${l.x}" dy="${l.fontSize * 1.3}">${escXml(line)}</tspan>\n`;
                        }
                    });
                    elements += `  </text>\n`;
                }
            });

            return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${SVG_W} ${SVG_H}" width="${SVG_W}" height="${SVG_H}">
${elements}</svg>`;
        }

        function downloadSVG() {
            if (!lastSVGData) return;
            downloadFile(lastSVGData.svgFull, 'design-with-image.svg', 'image/svg+xml');
            showToast('SVG（画像付き）をダウンロード！');
        }

        function downloadSVGTextOnly() {
            if (!lastSVGData) return;
            downloadFile(lastSVGData.svgTextOnly, 'text-layers.svg', 'image/svg+xml');
            showToast('SVG（テキストのみ）をダウンロード！');
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
        }

        // === デザインごと抽出 ===
        function handleDesignResult(text) {
            let htmlCode = text.replace(/^```html?\n?/i, '').replace(/\n?```$/i, '').trim();
            lastDesignHTML = htmlCode;
            extractedText.value = htmlCode;
            designTabs.classList.add('show');
            layerEditorWrapper.classList.remove('show');
            renderDesignPreview(htmlCode);
            switchTab('preview');
            copyBtn.textContent = 'HTMLコピー';
        }

        function renderDesignPreview(html) {
            const doc = designIframe.contentDocument;
            doc.open();
            doc.write(html);
            doc.close();
            setTimeout(() => {
                try {
                    designIframe.style.height = Math.max(400, doc.documentElement.scrollHeight + 20) + 'px';
                } catch(e) {}
            }, 500);
        }

        function switchTab(tab) {
            const tabPreview = document.getElementById('tabPreview');
            const tabCode = document.getElementById('tabCode');
            if (tab === 'preview') {
                tabPreview.classList.add('active');
                tabCode.classList.remove('active');
                designIframe.style.display = 'block';
                extractedText.style.display = 'none';
            } else {
                tabCode.classList.add('active');
                tabPreview.classList.remove('active');
                designIframe.style.display = 'none';
                extractedText.style.display = 'block';
            }
        }

        function setNormalMode() {
            designTabs.classList.remove('show');
            designIframe.style.display = 'none';
            extractedText.style.display = 'block';
            layerEditorWrapper.classList.remove('show');
            lastDesignHTML = '';
            copyBtn.textContent = 'コピー';
        }

        function copyText() {
            const text = extractedText.value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => showToast('コピーしました！'));
        }

        function downloadDesignHTML() {
            if (!lastDesignHTML) return;
            const blob = new Blob([lastDesignHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'extracted-design.html'; a.click();
            URL.revokeObjectURL(url);
            showToast('ダウンロードしました！');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // プロンプト変更時
        promptSelect.addEventListener('change', () => {
            const mode = promptSelect.value;
            if (mode !== 'design') { designTabs.classList.remove('show'); designIframe.style.display = 'none'; extractedText.style.display = 'block'; }
            if (mode !== 'layer') { layerEditorWrapper.classList.remove('show'); }
            copyBtn.textContent = 'コピー';
            if (currentImageBase64) extractWithClaude();
        });
    </script>
</body>
</html>
