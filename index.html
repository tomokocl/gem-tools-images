<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像テキスト抽出ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .api-key-section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .api-key-section label {
            color: #888;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .api-key-input {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .api-key-input:focus {
            outline: none;
            border-color: #ff6b6b;
        }

        .api-key-status {
            font-size: 0.75rem;
            color: #666;
            white-space: nowrap;
        }

        .api-key-status.saved {
            color: #4caf50;
        }

        .drop-zone {
            border: 2px dashed #444;
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #1a1a1a;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #ff6b6b;
            background: #1f1a1a;
        }

        .drop-zone-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .drop-zone p {
            color: #999;
        }

        .drop-zone .browse {
            color: #ff6b6b;
            text-decoration: underline;
            cursor: pointer;
        }

        #fileInput {
            display: none;
        }

        .gallery {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .gallery-label {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .gallery-item {
            width: 80px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.7;
            transition: all 0.2s;
        }

        .gallery-item:hover {
            opacity: 1;
            border-color: #ff6b6b;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .main-area {
                grid-template-columns: 1fr;
            }
            .api-key-section {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .panel {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 1.5rem;
            min-height: 400px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .panel-title {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .preview-img {
            width: 100%;
            border-radius: 8px;
            display: none;
        }

        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #555;
            font-size: 0.9rem;
        }

        #extractedText {
            width: 100%;
            min-height: 300px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 1rem;
            font-size: 0.95rem;
            line-height: 1.7;
            resize: vertical;
            font-family: inherit;
        }

        #extractedText:focus {
            outline: none;
            border-color: #ff6b6b;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: #333;
            color: #ccc;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
        }

        .status {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            min-height: 1.2em;
            margin: 1rem 0;
        }

        .status.loading::after {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ff6b6b;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .copy-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.85rem;
            transition: transform 0.3s;
            z-index: 100;
        }

        .copy-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .prompt-select {
            background: #222;
            border: 1px solid #444;
            color: #ccc;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>画像テキスト抽出ツール</h1>
        <p class="subtitle">Claude APIのビジョン機能で画像内テキストを高精度抽出。抽出後はそのまま編集・コピー可能</p>

        <div class="api-key-section">
            <label for="apiKeyInput">Claude API Key:</label>
            <input type="password" class="api-key-input" id="apiKeyInput" placeholder="sk-ant-api03-...">
            <span class="api-key-status" id="apiKeyStatus"></span>
        </div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">📷</div>
            <p>画像をドラッグ＆ドロップ、または<span class="browse">ファイルを選択</span></p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <span class="gallery-label">リポジトリ内の画像:</span>
        <div class="gallery" id="gallery"></div>

        <div class="status" id="status"></div>

        <div class="main-area">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">プレビュー</span>
                </div>
                <img class="preview-img" id="previewImg">
                <div class="placeholder" id="previewPlaceholder">画像を選択してください</div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">抽出テキスト</span>
                    <div class="btn-group">
                        <select class="prompt-select" id="promptSelect">
                            <option value="extract">テキスト抽出</option>
                            <option value="structured">構造化抽出</option>
                            <option value="translate">抽出+英訳</option>
                        </select>
                        <button class="btn btn-secondary" onclick="copyText()">コピー</button>
                    </div>
                </div>
                <textarea id="extractedText" placeholder="ここに抽出されたテキストが表示されます。&#10;抽出後は自由に編集できます。"></textarea>
            </div>
        </div>
    </div>

    <div class="copy-toast" id="toast">コピーしました！</div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const extractedText = document.getElementById('extractedText');
        const statusEl = document.getElementById('status');
        const gallery = document.getElementById('gallery');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiKeyStatus = document.getElementById('apiKeyStatus');
        const promptSelect = document.getElementById('promptSelect');

        // 現在の画像データ (base64)
        let currentImageBase64 = null;
        let currentMediaType = 'image/png';

        // APIキーをlocalStorageに保存/復元
        const savedKey = localStorage.getItem('claude_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
            apiKeyStatus.textContent = '保存済み';
            apiKeyStatus.className = 'api-key-status saved';
        }

        apiKeyInput.addEventListener('input', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('claude_api_key', key);
                apiKeyStatus.textContent = '保存済み';
                apiKeyStatus.className = 'api-key-status saved';
            } else {
                localStorage.removeItem('claude_api_key');
                apiKeyStatus.textContent = '';
                apiKeyStatus.className = 'api-key-status';
            }
        });

        // プロンプト定義
        const prompts = {
            extract: 'この画像に含まれるすべてのテキストを正確に抽出してください。レイアウトや改行をできるだけ保持してください。テキストのみを出力し、説明は不要です。',
            structured: 'この画像に含まれるテキストを構造化して抽出してください。見出し、本文、日時、名前などを分類し、Markdown形式で出力してください。',
            translate: 'この画像に含まれるすべてのテキストを抽出し、その後に英語翻訳を付けてください。フォーマット:\n\n【原文】\n(抽出テキスト)\n\n【English Translation】\n(翻訳)'
        };

        // リポジトリ内の画像一覧
        const repoImages = [
            '13_ashisutannto2.png',
            'gem00.png', 'gem01.png', 'gem02.png', 'gem03.png', 'gem04.png',
            'gem05.png', 'gem06.png', 'gem07.png', 'gem08.png', 'gem09.png',
            'gem10.png', 'gem11.png', 'gem13.png', 'gem14.png', 'gem15.png',
            'gem16.png', 'gem17.png', 'gem19.png', 'gem_short.png'
        ];

        // ギャラリー生成
        repoImages.forEach(name => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="${name}" alt="${name}" title="${name}">`;
            item.addEventListener('click', () => loadRepoImage(name));
            gallery.appendChild(item);
        });

        function loadRepoImage(name) {
            previewImg.src = name;
            previewImg.style.display = 'block';
            previewPlaceholder.style.display = 'none';

            fetch(name)
                .then(r => r.blob())
                .then(blob => blobToBase64(blob))
                .then(({ base64, mediaType }) => resizeImageIfNeeded(base64, mediaType))
                .then(({ base64, mediaType }) => {
                    currentImageBase64 = base64;
                    currentMediaType = mediaType;
                    extractWithClaude();
                });
        }

        const MAX_BASE64_BYTES = 5 * 1024 * 1024; // 5MB

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const dataUrl = reader.result;
                    const base64 = dataUrl.split(',')[1];
                    const mediaType = dataUrl.match(/^data:(.*?);/)[1];
                    resolve({ base64, mediaType });
                };
                reader.readAsDataURL(blob);
            });
        }

        // 画像を5MB以下にリサイズ
        function resizeImageIfNeeded(base64, mediaType) {
            return new Promise((resolve) => {
                const byteSize = atob(base64).length;
                if (byteSize <= MAX_BASE64_BYTES) {
                    resolve({ base64, mediaType });
                    return;
                }

                const img = new Image();
                img.onload = () => {
                    let scale = Math.sqrt(MAX_BASE64_BYTES / byteSize) * 0.9; // 少し余裕を持たせる
                    let quality = 0.85;
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    function tryResize() {
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        const resizedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        const resizedBase64 = resizedDataUrl.split(',')[1];
                        const resizedSize = atob(resizedBase64).length;

                        if (resizedSize <= MAX_BASE64_BYTES) {
                            statusEl.textContent = `画像をリサイズしました (${(byteSize/1024/1024).toFixed(1)}MB → ${(resizedSize/1024/1024).toFixed(1)}MB)`;
                            resolve({ base64: resizedBase64, mediaType: 'image/jpeg' });
                        } else {
                            // まだ大きければ縮小を繰り返す
                            scale *= 0.8;
                            quality = Math.max(0.5, quality - 0.1);
                            tryResize();
                        }
                    }

                    tryResize();
                };
                img.src = `data:${mediaType};base64,${base64}`;
            });
        }

        // ドラッグ＆ドロップ
        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = async e => {
                const dataUrl = e.target.result;
                previewImg.src = dataUrl;
                previewImg.style.display = 'block';
                previewPlaceholder.style.display = 'none';

                const base64 = dataUrl.split(',')[1];
                const mediaType = dataUrl.match(/^data:(.*?);/)[1];
                const resized = await resizeImageIfNeeded(base64, mediaType);
                currentImageBase64 = resized.base64;
                currentMediaType = resized.mediaType;
                extractWithClaude();
            };
            reader.readAsDataURL(file);
        }

        async function extractWithClaude() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                statusEl.textContent = 'Claude API Keyを入力してください';
                statusEl.className = 'status';
                return;
            }

            if (!currentImageBase64) return;

            statusEl.textContent = 'Claude APIで解析中...';
            statusEl.className = 'status loading';
            extractedText.value = '';

            const promptText = prompts[promptSelect.value];

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 4096,
                        messages: [{
                            role: 'user',
                            content: [
                                {
                                    type: 'image',
                                    source: {
                                        type: 'base64',
                                        media_type: currentMediaType,
                                        data: currentImageBase64
                                    }
                                },
                                {
                                    type: 'text',
                                    text: promptText
                                }
                            ]
                        }]
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || `API Error: ${response.status}`);
                }

                const data = await response.json();
                const text = data.content
                    .filter(c => c.type === 'text')
                    .map(c => c.text)
                    .join('\n');

                extractedText.value = text;
                statusEl.textContent = '抽出完了！';
                statusEl.className = 'status';
            } catch (err) {
                statusEl.textContent = 'エラー: ' + err.message;
                statusEl.className = 'status';
            }
        }

        function copyText() {
            const text = extractedText.value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        // プロンプト変更時に再実行
        promptSelect.addEventListener('change', () => {
            if (currentImageBase64) {
                extractWithClaude();
            }
        });
    </script>
</body>
</html>
